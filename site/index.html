<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>System Design Atlas</title>
    <meta name="description" content="A system-design study set: 35 systems and a toolkit, each with a sourced Markdown note and an interactive C4 diagram." />
    <meta property="og:title" content="System Design Atlas" />
    <meta property="og:description" content="35 sourced system-design notes with interactive diagrams, plus casebook, primers and a workbook." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:," /> <!-- no icon file yet; stops a 404 on every load -->
    <script>
      // Applies the saved reading settings before first paint. Same cookie format as src/settings-core.ts.
      try {
        var m = document.cookie.match(/(?:^|; )atlas-settings=([^;]*)/);
        var c = m ? JSON.parse(decodeURIComponent(m[1])) : {}, r = document.documentElement;
        if (c.theme === "light" || c.theme === "warm" || c.theme === "dark") r.dataset.theme = c.theme;
        if (c.font === "atkinson" || c.font === "lexend" || c.font === "literata") r.dataset.font = c.font;
        if (c.lang === "pt-BR") r.lang = "pt-BR";
        if (typeof c.size === "number" && c.size >= 13 && c.size <= 24) r.style.setProperty("--fs", Math.round(c.size) + "px");
      } catch (e) { /* defaults */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <h1>System Design Atlas</h1>
      <p>This site needs JavaScript. The notes are plain Markdown: see <a href="llms.txt">llms.txt</a> for an index, or the <a href="https://github.com/allmonty/system-design-atlas">repository</a>.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
